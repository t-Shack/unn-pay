# UNN Pay — Render deployment (spec §12).
#
# Three services and one database:
#   unn-pay-api        the Express API
#   unn-pay-worker     reconciliation, outbox drain, daily maintenance
#   unn-pay-admin      the Bursary dashboard, a static site
#
# Two things here are deliberate and must not be "simplified":
#
#  1. The worker is a separate service, not a setInterval inside the API. If the
#     API restarts mid sweep, the sweep must not be lost.
#  2. Migrations run as a release command, never at boot. Two instances starting
#     together would otherwise race each other through the same migration.
#
# Neither service may be on the free tier. Free instances sleep after inactivity,
# and a sleeping API means a delayed bank webhook — which is precisely the
# failure this system exists to prevent.

databases:
  - name: unn-pay-db
    databaseName: unnpay
    user: unnpay
    plan: standard
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  # --- API -------------------------------------------------------------------
  - type: web
    name: unn-pay-api
    runtime: node
    plan: standard
    region: frankfurt
    branch: main
    rootDir: backend
    buildCommand: npm ci --omit=dev
    preDeployCommand: npx sequelize-cli db:migrate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: unn-pay-api
      - key: DATABASE_URL
        fromDatabase:
          name: unn-pay-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "10"

      # Generated once by Render and then shared with the worker, so both
      # processes verify the same tokens and sign the same receipts.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RECEIPT_SIGNING_SECRET
        generateValue: true

      - key: BANK_ADAPTER
        value: sandbox # switch to "gtbank" when credentials arrive (§5.1, §16)
      - key: BANK_WEBHOOK_SECRET
        sync: false # set by hand; must match what the bank was given
      - key: BANK_WEBHOOK_TOLERANCE_SECONDS
        value: "300"

      # GTBank only. Read by GTBankAdapter and by nothing else.
      - key: GTBANK_API_BASE_URL
        sync: false
      - key: GTBANK_API_KEY
        sync: false
      - key: GTBANK_MERCHANT_ID
        sync: false

      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: UNN Pay <no-reply@pay.unn.edu.ng>
      - key: BURSARY_ALERT_EMAIL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false

      - key: PAYMENT_REFERENCE_TTL_HOURS
        value: "24"
      - key: UNAPPLIED_RESOLUTION_DAYS
        value: "90"

      - key: PUBLIC_BASE_URL
        value: https://pay.unn.edu.ng
      - key: ADMIN_ORIGINS
        value: https://bursary.pay.unn.edu.ng
      - key: APP_SCHEMES
        value: unnpay

      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: LOG_LEVEL
        value: info

  # --- Worker ----------------------------------------------------------------
  - type: worker
    name: unn-pay-worker
    runtime: node
    plan: standard
    region: frankfurt
    branch: main
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:worker
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: unn-pay-worker
      - key: DATABASE_URL
        fromDatabase:
          name: unn-pay-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      # Smaller pool: the worker is a handful of scheduled jobs, not a fleet of
      # concurrent requests, and it must never starve the API of connections.
      - key: DATABASE_POOL_MAX
        value: "5"

      # Every secret below is taken from the API service, so the two processes
      # cannot drift apart. A worker signing receipts with a different secret
      # would produce receipts that fail their own verification.
      - key: JWT_ACCESS_SECRET
        fromService:
          type: web
          name: unn-pay-api
          envVarKey: JWT_ACCESS_SECRET
      - key: JWT_REFRESH_SECRET
        fromService:
          type: web
          name: unn-pay-api
          envVarKey: JWT_REFRESH_SECRET
      - key: RECEIPT_SIGNING_SECRET
        fromService:
          type: web
          name: unn-pay-api
          envVarKey: RECEIPT_SIGNING_SECRET
      - key: BANK_ADAPTER
        fromService:
          type: web
          name: unn-pay-api
          envVarKey: BANK_ADAPTER
      - key: BANK_WEBHOOK_SECRET
        fromService:
          type: web
          name: unn-pay-api
          envVarKey: BANK_WEBHOOK_SECRET
      - key: GTBANK_API_BASE_URL
        fromService:
          type: web
          name: unn-pay-api
          envVarKey: GTBANK_API_BASE_URL
      - key: GTBANK_API_KEY
        fromService:
          type: web
          name: unn-pay-api
          envVarKey: GTBANK_API_KEY
      - key: GTBANK_MERCHANT_ID
        fromService:
          type: web
          name: unn-pay-api
          envVarKey: GTBANK_MERCHANT_ID
      - key: RESEND_API_KEY
        fromService:
          type: web
          name: unn-pay-api
          envVarKey: RESEND_API_KEY
      - key: EMAIL_FROM
        fromService:
          type: web
          name: unn-pay-api
          envVarKey: EMAIL_FROM
      - key: BURSARY_ALERT_EMAIL
        fromService:
          type: web
          name: unn-pay-api
          envVarKey: BURSARY_ALERT_EMAIL
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        fromService:
          type: web
          name: unn-pay-api
          envVarKey: FIREBASE_SERVICE_ACCOUNT_JSON
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: unn-pay-api
          envVarKey: PUBLIC_BASE_URL
      - key: UNAPPLIED_RESOLUTION_DAYS
        value: "90"
      - key: PAYMENT_REFERENCE_TTL_HOURS
        value: "24"

      - key: RECONCILE_CRON
        value: "*/10 * * * *"
      - key: OUTBOX_CRON
        value: "*/1 * * * *"
      - key: DAILY_MAINTENANCE_CRON
        value: "15 1 * * *"

      - key: SENTRY_DSN
        fromService:
          type: web
          name: unn-pay-api
          envVarKey: SENTRY_DSN
      - key: LOG_LEVEL
        value: info

  # --- Admin dashboard -------------------------------------------------------
  - type: web
    name: unn-pay-admin
    runtime: static
    branch: main
    rootDir: admin-dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://pay.unn.edu.ng
    routes:
      # A single page app: every unknown path is handled by the router, not 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
