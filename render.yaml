# UNN Pay — Render LIVE DEMO deployment (free tier, Neon database).
#
# The production layout (paid API, separate worker, Render database) is in
# render.production.yaml. This one is a public demonstration:
#
#   unn-pay-api     the Express API, with the worker's jobs running in process
#   unn-pay-admin   the Bursary dashboard, a static site
#   database        Neon PostgreSQL, supplied as DATABASE_URL
#
# What makes it a demo, and why each is acceptable here and nowhere else:
#
#  - BANK_ADAPTER is sandbox and NODE_ENV is development. No real money exists in
#    this deployment, so the sandbox simulation routes are mounted on purpose:
#    they are how a payment is made during a demonstration. Activation codes are
#    printed to the service log instead of emailed.
#  - The free tier has no background worker service, so RUN_WORKER_IN_API runs
#    the scheduler inside the API. The free API sleeps after 15 idle minutes; the
#    first request after that takes about a minute while it wakes.
#  - Migrations and the (idempotent) demo seed run in the build command, since
#    the free tier has no pre-deploy command.
#
# None of this is suitable for real fees. Use render.production.yaml for that.

services:
  # --- API (and in process worker) -------------------------------------------
  - type: web
    name: unn-pay-api
    runtime: node
    plan: free
    region: virginia # same AWS region as the Neon database (us-east-1)
    branch: main
    rootDir: backend
    buildCommand: npm ci --omit=dev && npm run migrate && npm run seed:demo
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: development
      - key: NODE_VERSION
        value: "22"
      - key: SERVICE_NAME
        value: unn-pay-api
      - key: LOG_LEVEL
        value: info

      # The Neon connection string, pasted in when the Blueprint is created.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"

      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RECEIPT_SIGNING_SECRET
        generateValue: true

      - key: BANK_ADAPTER
        value: sandbox
      - key: BANK_WEBHOOK_SECRET
        generateValue: true
      - key: BANK_WEBHOOK_TOLERANCE_SECONDS
        value: "300"

      - key: RUN_WORKER_IN_API
        value: "true"
      - key: RECONCILE_CRON
        value: "*/10 * * * *"
      - key: OUTBOX_CRON
        value: "*/1 * * * *"
      - key: DAILY_MAINTENANCE_CRON
        value: "15 1 * * *"

      - key: PAYMENT_REFERENCE_TTL_HOURS
        value: "24"
      - key: UNAPPLIED_RESOLUTION_DAYS
        value: "90"

      # PUBLIC_BASE_URL is left unset: the API falls back to Render's
      # RENDER_EXTERNAL_URL, its own public https address.
      - key: ADMIN_ORIGINS
        value: https://unn-pay-admin.onrender.com
      - key: APP_SCHEMES
        value: unnpay

  # --- Admin dashboard -------------------------------------------------------
  - type: web
    name: unn-pay-admin
    runtime: static
    branch: main
    rootDir: admin-dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://unn-pay-api.onrender.com
    routes:
      # A single page app: every unknown path is handled by the router, not 404.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
